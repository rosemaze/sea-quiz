    <style>
      :root {
        --bg: #fdf6ec;
        --card: #ffffff;
        --ink: #1f2933;
        --muted: #6b7280;
        --accent: #c8102e;
        --accent-dark: #9b0c23;
        --line: #e5dccb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        line-height: 1.5;
      }
      main {
        width: 100%;
        max-width: 680px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 8px 24px rgba(31, 41, 51, 0.08);
      }
      .progress {
        height: 6px;
        background: var(--line);
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 8px;
      }
      .progress > div {
        height: 100%;
        background: var(--accent);
      }
      .count {
        color: var(--muted);
        font-size: 0.875rem;
        margin: 0 0 32px;
      }
      h1 {
        font-size: 1.6rem;
        line-height: 1.4;
        margin: 0 0 16px;
      }
      .choices {
        list-style: none;
        margin: 24px 0 0;
        padding: 0;
        display: grid;
        gap: 12px;
      }
      .choices button {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        border: 2px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: inherit;
        font: inherit;
        font-size: 1.1rem;
        text-align: left;
        cursor: pointer;
      }
      .choices button:hover:not(:disabled) {
        border-color: var(--accent);
        background: #fbe9ec;
      }
      .choices button:focus-visible {
        outline: 3px solid #1d4ed8;
        outline-offset: 2px;
      }
      .choices button:disabled {
        cursor: default;
        color: inherit;
      }
      .choices button.correct {
        border-color: #15803d;
        background: #dcfce7;
      }
      .choices button.correct .letter {
        background: #15803d;
      }
      .choices button.wrong {
        border-color: #b91c1c;
        background: #fee2e2;
        opacity: 0.8;
      }
      .choices button.wrong .letter {
        background: #b91c1c;
      }
      .reveal {
        margin: 24px 0 0;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 16px;
      }
      .reveal figure {
        margin: 0;
      }
      .reveal img {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        border-radius: 12px;
      }
      .reveal figure.portrait {
        max-width: 360px;
      }
      .reveal figure.portrait img {
        aspect-ratio: auto;
        height: auto;
        max-height: 480px;
        object-fit: contain;
        background: var(--line);
      }
      .reveal figure.portrait.large {
        max-width: 640px;
      }
      .reveal figure.portrait.large img {
        max-height: 640px;
      }
      .reveal figcaption {
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .reveal .missing {
        padding: 32px 16px;
        border: 2px dashed var(--line);
        border-radius: 12px;
        color: var(--muted);
        text-align: center;
      }
      .question-image {
        display: block;
        width: 100%;
        max-height: 420px;
        object-fit: contain;
        margin-top: 8px;
        border-radius: 12px;
      }
      .answer-form {
        margin-top: 24px;
      }
      .answer-form label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }
      .answer-row {
        display: flex;
        gap: 12px;
      }
      .answer-row input {
        flex: 1;
        min-width: 0;
        padding: 12px 14px;
        border: 2px solid var(--line);
        border-radius: 10px;
        font: inherit;
        font-size: 1.1rem;
      }
      .answer-row input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .answer-row button {
        cursor: pointer;
      }
      .answer-row button:disabled,
      .answer-row input:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .show-answer {
        margin-top: 24px;
      }
      .correct-title {
        color: #15803d;
      }
      .feedback {
        min-height: 1.5em;
        margin: 16px 0 0;
        font-weight: 600;
      }
      .feedback.correct {
        color: #15803d;
      }
      .feedback.wrong {
        color: #b91c1c;
      }
      .choices .letter {
        flex: none;
        width: 1.9em;
        height: 1.9em;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        font-size: 0.9rem;
        text-transform: uppercase;
      }
      .nav {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 40px;
      }
      .btn {
        font: inherit;
        font-weight: 600;
        padding: 12px 22px;
        border-radius: 10px;
        border: 2px solid var(--accent);
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        display: inline-block;
      }
      .btn:hover {
        background: var(--accent-dark);
        border-color: var(--accent-dark);
      }
      .btn.secondary {
        background: transparent;
        color: var(--accent);
      }
      .btn.secondary:hover {
        background: #fbe9ec;
      }
      .btn:focus-visible {
        outline: 3px solid #1d4ed8;
        outline-offset: 2px;
      }
    </style>
  </head>

      const app = document.getElementById("app");
      const total = QUESTIONS.length;
      const esc = (s) =>
        s.replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      function renderStart() {
        app.innerHTML = `
                         <h1>Malaysia &amp; Singapore Quiz</h1>
                         <p>${total} questions, one per page.</p>
                         <a class="btn" href="#/q/1">Start</a>`;
        document.title = "Malaysia & Singapore Quiz";
      }

      function renderChoices(choices) {
        if (!choices) return "";
        const items = Object.entries(choices)
          .map(
            ([letter, text]) =>
              `<li><button type="button" data-letter="${esc(letter)}"><span class="letter" aria-hidden="true">${esc(letter)}</span><span>${esc(text)}</span></button></li>`,
          )
          .join("");
        return `<ul class="choices" aria-label="Answer choices">${items}</ul>
                <p id="feedback" class="feedback" role="status"></p>`;
      }

      function renderReveal(n) {
        const { choices, answer, reveal } = QUESTIONS[n - 1];
        const isLast = n === total;
        app.innerHTML = `
                         <p class="count">Question ${n} of ${total}</p>
                         <h1 class="correct-title">${choices ? "Correct!" : "Answer"}</h1>
                         <p>The answer is ${esc(choices ? `${answer.toUpperCase()}: ${choices[answer]}` : [answer].flat()[0])}</p>
                         <div class="reveal">
                           ${reveal.images
                             .map(
                               ({ image, alt, caption, portrait, large }) => `
                           <figure class="${[portrait && "portrait", large && "large"].filter(Boolean).join(" ")}">
                             <img src="${esc(image)}" alt="${esc(alt)}" onerror="this.hidden=true;this.nextElementSibling.hidden=false">
                             <p class="missing" hidden>Add the photo at ${esc(image)} to show it here.</p>
                             <figcaption>${esc(caption)}</figcaption>
                           </figure>`,
                             )
                             .join("")}
                         </div>
                         <div class="nav">
                           <a class="btn secondary" href="#/q/${n}">Back to question</a>
                           ${isLast ? `<a class="btn" href="#/">Done</a>` : `<a class="btn" href="#/q/${n + 1}">Next</a>`}
                         </div>`;
        document.title = `Question ${n} answer`;
      }

      function wireChoices(n, choices, answer, reveal) {
        const list = document.querySelector(".choices");
        if (!list) return;
        const feedback = document.getElementById("feedback");
        list.addEventListener("click", (e) => {
          const button = e.target.closest("button");
          if (!button || button.disabled) return;
          const letter = button.dataset.letter;
          if (letter === answer && reveal) {
            location.hash = `#/q/${n}/answer`;
          } else if (letter === answer) {
            list.querySelectorAll("button").forEach((b) => (b.disabled = true));
            button.classList.add("correct");
            feedback.className = "feedback correct";
            feedback.textContent = `Correct! The answer is ${letter.toUpperCase()}: ${choices[letter]}`;
          } else {
            button.disabled = true;
            button.classList.add("wrong");
            feedback.className = "feedback wrong";
            feedback.textContent = "Not quite - try again.";
          }
        });
      }

      const normalize = (s) => s.trim().toLowerCase().replace(/\s+/g, " ");

      function renderAnswerForm() {
        return `<form id="answer-form" class="answer-form">
                           <label for="answer-input">Your answer</label>
                           <div class="answer-row">
                             <input id="answer-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
                             <button type="submit" class="btn">Check</button>
                           </div>
                         </form>
                         <p id="feedback" class="feedback" role="status"></p>`;
      }

      function wireAnswerForm(n, answers, reveal) {
        const form = document.getElementById("answer-form");
        const input = document.getElementById("answer-input");
        const feedback = document.getElementById("feedback");
        input.focus();
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const value = normalize(input.value);
          if (!value) return;
          if (answers.some((a) => normalize(a) === value)) {
            if (reveal) {
              location.hash = `#/q/${n}/answer`;
              return;
            }
            input.disabled = true;
            form.querySelector("button").disabled = true;
            feedback.className = "feedback correct";
            feedback.textContent = `Correct! The answer is ${answers[0]}`;
          } else {
            feedback.className = "feedback wrong";
            feedback.textContent = "Not quite - try again.";
            input.select();
          }
        });
      }

      function renderQuestion(n) {
        const isLast = n === total;
        const { question, choices, answer, reveal, image } = QUESTIONS[n - 1];
        app.innerHTML = `
                         <div class="progress" role="progressbar" aria-valuemin="1" aria-valuemax="${total}" aria-valuenow="${n}">
                           <div style="width:${(n / total) * 100}%"></div>
                         </div>
                         <p class="count">Question ${n} of ${total}</p>
                         <h1>${esc(question)}</h1>
                         ${image ? `<img class="question-image" src="${esc(image.src)}" alt="${esc(image.alt)}">` : ""}
                         ${renderChoices(choices)}
                         ${Array.isArray(answer) ? renderAnswerForm() : ""}
                         ${reveal && !choices ? `<a class="btn show-answer" href="#/q/${n}/answer">Show answer</a>` : ""}
                         <div class="nav">
                           <a class="btn secondary" href="${n > 1 ? `#/q/${n - 1}` : "#/"}">${n > 1 ? "Back" : "Home"}</a>
                           ${isLast ? `<a class="btn" href="#/">Done</a>` : `<a class="btn" href="#/q/${n + 1}">Next</a>`}
                         </div>`;
        document.title = `Question ${n} of ${total}`;
        wireChoices(n, choices, answer, reveal);
        if (Array.isArray(answer)) wireAnswerForm(n, answer, reveal);
      }

      function route() {
        const revealMatch = location.hash.match(/^#\/q\/(\d+)\/answer$/);
        if (revealMatch && QUESTIONS[+revealMatch[1] - 1]?.reveal)
          return renderReveal(+revealMatch[1]);
        const match = location.hash.match(/^#\/q\/(\d+)$/);
        if (match && +match[1] >= 1 && +match[1] <= total)
          return renderQuestion(+match[1]);
        renderStart();
      }

      document.addEventListener("keydown", (e) => {
        if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
        if (e.target.closest("input, textarea")) return;
        const match = location.hash.match(/^#\/q\/(\d+)$/);
        if (!match) return;
        const next = +match[1] + (e.key === "ArrowRight" ? 1 : -1);
        if (next >= 1 && next <= total) location.hash = `#/q/${next}`;
      });

      window.addEventListener("hashchange", route);
      route();
    </script>
  </body>
</html>
