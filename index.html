      const app = document.getElementById("app");

      const esc = (s) =>
        s.replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      function renderStart() {
        const categories = [
          ...new Set(QUESTIONS.map((q) => q.category)),
        ].filter(Boolean);
        app.innerHTML = `
                          <h1>Malaysia &amp; Singapore Quiz</h1>

                          <a class="btn" href="#/q/1">Start</a>
                          <h2 class="random-title">Or get a random question from a category</h2>
                          <div class="categories">
                            ${categories.map((c, i) => `<button type="button" class="btn secondary" data-color="${["red", "green", "yellow", "blue"][i % 4]}" data-category="${esc(c)}">${esc(c)} (${QUESTIONS.filter((q) => q.category === c).length})</button>`).join("")}
                          </div>`;
        document.title = "Malaysia & Singapore Quiz";
        document.querySelector(".categories").addEventListener("click", (e) => {
          const button = e.target.closest("button");
          if (!button) return;
          const matches = QUESTIONS.map((q, i) =>
            q.category === button.dataset.category ? i + 1 : 0,
          ).filter(Boolean);
          location.hash = `#/q/${matches[Math.floor(Math.random() * matches.length)]}`;
        });
      }

      function renderChoices(choices) {
        if (!choices) return "";
        const items = Object.entries(choices)
          .map(
            ([letter, text]) =>
              `<li><button type="button" data-letter="${esc(letter)}"><span class="letter" aria-hidden="true">${esc(letter)}</span><span>${esc(text)}</span></button></li>`,
          )
          .join("");
        return `<ul class="choices" aria-label="Answer choices">${items}</ul>
                 <p id="feedback" class="feedback" role="status"></p>`;
      }

      // Turns **bold** markers in already-escaped text into <strong> tags.
      const renderBold = (html) =>
        html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");

      // Wraps the answer in **bold** markers wherever it appears in the explanation.
      function boldAnswer(text, answers) {
        const candidates = answers
          .flatMap((a) => {
            const full = String(a);
            const short = full.replace(/\s*\(.*?\)/g, "").split(" - ")[0];
            return [full, short, short.replace(/^the\s+/i, "")];
          })
          .map((a) => a.trim())
          .filter((a, i, all) => a.length >= 3 && all.indexOf(a) === i)
          .sort((x, y) => y.length - x.length);
        if (!candidates.length) return text;
        const escaped = candidates.map((a) =>
          a.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"),
        );
        const pattern = new RegExp(
          `(?<![\\w])(?:${escaped.join("|")})(?![\\w])`,
          "gi",
        );
        return text
          .split(/(\*\*.+?\*\*)/)
          .map((part) =>
            part.startsWith("**") ? part : part.replace(pattern, "**$&**"),
          )
          .join("");
      }

                          ${reveal.details ? `<ul class="details">${reveal.details.map((d) => `<li>${renderBold(esc(d))}</li>`).join("")}</ul>` : ""}
                          <div class="reveal">

                            <figure class="${[portrait && "portrait", large && "large"].filter(Boolean).join(" ")}">
                              <img src="${esc(image)}" alt="${esc(alt)}" onerror="this.hidden=true;this.nextElementSibling.hidden=false">

                              <figcaption>${esc(caption)}</figcaption>
                            </figure>`,
                              )
                              .join("")}
                          </div>
                          <div class="nav">
                            <a class="btn secondary" href="#/q/${n}">Back to question</a>
                            ${isLast ? `<a class="btn" href="#/">Done</a>` : `<a class="btn" href="#/q/${n + 1}">Next</a>`}
                          </div>`;
        document.title = `Question ${n} answer`;
      }

      function wireChoices(n, choices, answer, reveal) {
        const list = document.querySelector(".choices");
        if (!list) return;
        const feedback = document.getElementById("feedback");
        list.addEventListener("click", (e) => {
          const button = e.target.closest("button");
          if (!button || button.disabled) return;
          const letter = button.dataset.letter;
          if (letter === answer && reveal) {
            location.hash = `#/q/${n}/answer`;
          } else if (letter === answer) {
            list.querySelectorAll("button").forEach((b) => (b.disabled = true));
            button.classList.add("correct");
            feedback.className = "feedback correct";
            feedback.textContent = `Correct! The answer is ${letter.toUpperCase()}: ${choices[letter]}`;
          } else {
            button.disabled = true;
            button.classList.add("wrong");
            const note = QUESTIONS[n - 1].notes?.[letter];
            if (note) {
              const el = document.createElement("small");
              el.className = "note";
              el.textContent = note;
              button.append(el);
            }
            feedback.className = "feedback wrong";
            feedback.textContent = "Not quite - try again.";
          }
        });
      }

      const matchedAnswers = {};

      const normalize = (s) =>
        String(s).trim().toLowerCase().replace(/\s+/g, " ");

      function renderAnswerForm() {
        return `<form id="answer-form" class="answer-form">
                            <label for="answer-input">Your answer</label>
                            <div class="answer-row">
                              <input id="answer-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
                              <button type="submit" class="btn">Check</button>
                            </div>
                          </form>
                          <p id="feedback" class="feedback" role="status"></p>`;
      }

      function wireAnswerForm(n, answers, reveal) {
        const form = document.getElementById("answer-form");
        const input = document.getElementById("answer-input");
        const feedback = document.getElementById("feedback");
        input.focus();
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const value = normalize(input.value);
          if (!value) return;
          const matched = answers.find((a) => normalize(a) === value);
          if (matched !== undefined) {
            matchedAnswers[n] = matched;
            if (reveal) {
              location.hash = `#/q/${n}/answer`;
              return;
            }
            input.disabled = true;
            form.querySelector("button").disabled = true;
            feedback.className = "feedback correct";
            feedback.textContent = `Correct! The answer is ${answers[0]}`;
          } else {
            feedback.className = "feedback wrong";
            feedback.textContent = "Not quite - try again.";
            input.select();
          }
        });
      }

      function renderQuestion(n) {
        const isLast = n === total;
        const { question, choices, answer, reveal, image } = QUESTIONS[n - 1];
        app.innerHTML = `
                          <div class="progress" role="progressbar" aria-valuemin="1" aria-valuemax="${total}" aria-valuenow="${n}">
                            <div style="width:${(n / total) * 100}%"></div>
                          </div>
                          <p class="count"><span>Question ${n} of ${total}</span><span>${esc(QUESTIONS[n - 1].category ?? "")}</span></p>
                          <h1>${esc(question)}</h1>
                          ${image ? `<img class="question-image" src="${esc(image.src)}" alt="${esc(image.alt)}">` : ""}
                          ${renderChoices(choices)}
                          ${Array.isArray(answer) ? renderAnswerForm() : ""}
                          ${reveal && !choices ? `<a class="btn show-answer" href="#/q/${n}/answer">Show answer</a>` : ""}
                          <div class="nav">
                            <a class="btn secondary" href="${n > 1 ? `#/q/${n - 1}` : "#/"}">${n > 1 ? "Back" : "Home"}</a>
                            ${isLast ? `<a class="btn" href="#/">Done</a>` : `<a class="btn" href="#/q/${n + 1}">Next</a>`}
                          </div>`;
        document.title = `Question ${n} of ${total}`;
        wireChoices(n, choices, answer, reveal);
        if (Array.isArray(answer)) wireAnswerForm(n, answer, reveal);
      }

      function route() {
        const revealMatch = location.hash.match(/^#\/q\/(\d+)\/answer$/);
        if (revealMatch && QUESTIONS[+revealMatch[1] - 1]?.reveal) {
          renderReveal(+revealMatch[1]);
          return addHomeLink();
        }
        const match = location.hash.match(/^#\/q\/(\d+)$/);
        if (match && +match[1] >= 1 && +match[1] <= total) {
          renderQuestion(+match[1]);
          return addHomeLink();
        }
        renderStart();
      }

      function addHomeLink() {
        app.insertAdjacentHTML(
          "afterbegin",
          '<a class="home-link" href="#/">&larr; Home</a>',
        );
      }

      document.addEventListener("keydown", (e) => {
        if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
        if (e.target.closest("input, textarea")) return;
        const match = location.hash.match(/^#\/q\/(\d+)$/);
        if (!match) return;
        const next = +match[1] + (e.key === "ArrowRight" ? 1 : -1);
        if (next >= 1 && next <= total) location.hash = `#/q/${next}`;
      });

      const menuButton = document.getElementById("menu-button");
      const menuPanel = document.getElementById("menu-panel");
      document.getElementById("menu-list").innerHTML = QUESTIONS.map(
        (q, i) =>
          `<li><a href="#/q/${i + 1}"><span class="num">${i + 1}</span><span class="text">${esc(q.question.replace(/\s+/g, " "))}</span></a></li>`,
      ).join("");

      function setMenu(open) {
        menuPanel.hidden = !open;
        menuButton.setAttribute("aria-expanded", String(open));
        if (!open) return;
        const current = location.hash.match(/^#\/q\/(\d+)/)?.[1];
        menuPanel.querySelectorAll("a").forEach((a) => {
          if (a.getAttribute("href") === `#/q/${current}`)
            a.setAttribute("aria-current", "page");
          else a.removeAttribute("aria-current");
        });
        menuPanel
          .querySelector("[aria-current]")
          ?.scrollIntoView({ block: "center" });
      }

      menuButton.addEventListener("click", () => setMenu(menuPanel.hidden));
      menuPanel.addEventListener("click", (e) => {
        if (e.target.closest("a")) setMenu(false);
      });
      document.addEventListener("click", (e) => {
        if (!menuPanel.hidden && !e.target.closest("#menu-panel, #menu-button"))
          setMenu(false);
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !menuPanel.hidden) {
          setMenu(false);
          menuButton.focus();
        }
      });

      window.addEventListener("hashchange", route);
      route();
    </script>
  </body>
</html>
